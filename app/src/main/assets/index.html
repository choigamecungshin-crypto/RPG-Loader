<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #0b0d12;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

button {
    font: inherit;
    border: 0;
    cursor: pointer;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 64px;
    padding: 0 18px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #10141c;
    border-bottom: 1px solid #202632;

    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 19px;
    font-weight: 700;
}

.logo-icon {
    width: 32px;
    height: 32px;

    border-radius: 8px;

    background: #1456A0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;
}

.add-button {
    background: #1456A0;
    color: white;

    padding: 10px 15px;

    border-radius: 8px;

    font-weight: 600;
}

.add-button:active {
    transform: scale(.96);
}

.hidden-input {
    display: none;
}

/* =========================
   MAIN
========================= */

.container {
    padding: 22px;
    max-width: 1200px;
    margin: auto;
}

.library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.library-title {
    font-size: 24px;
    font-weight: 700;
}

.game-count {
    color: #7f8999;
    font-size: 14px;
}

/* =========================
   EMPTY
========================= */

.empty {
    min-height: 55vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.empty-inner {
    max-width: 350px;
}

.empty-icon {
    width: 76px;
    height: 76px;

    margin: 0 auto 18px;

    border-radius: 18px;

    background: #151b25;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 36px;
}

.empty h2 {
    margin: 0 0 8px;
    font-size: 21px;
}

.empty p {
    margin: 0;

    color: #788292;

    line-height: 1.5;
}

.empty-add {
    margin-top: 20px;

    padding: 11px 18px;

    border-radius: 8px;

    background: #1456A0;
    color: white;

    font-weight: 600;
}

/* =========================
   GAME GRID
========================= */

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));

    gap: 16px;
}

.card {
    background: #11151d;

    border: 1px solid #202632;

    border-radius: 12px;

    overflow: hidden;

    transition: transform .15s;
}

.card:active {
    transform: scale(.98);
}

.cover {
    height: 150px;

    background: #171d27;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.default-cover {
    font-size: 48px;
}

.card-info {
    padding: 13px;
}

.card-name {
    font-size: 16px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-type {
    margin-top: 5px;

    color: #788292;

    font-size: 12px;
}

.card-path {
    margin-top: 7px;

    color: #596372;

    font-size: 11px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   MODAL BACKDROP
========================= */

.modal-backdrop {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, .72);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 40;
}

.modal-backdrop.show {
    display: flex;
}

/* =========================
   ADD GAME MODAL
========================= */

.modal {
    width: 100%;
    max-width: 420px;

    background: #121720;

    border: 1px solid #29313e;

    border-radius: 16px;

    padding: 20px;
}

.modal-title {
    font-size: 21px;
    font-weight: 700;

    margin-bottom: 18px;
}

.input-label {
    display: block;

    margin-bottom: 7px;

    color: #9ba5b5;

    font-size: 13px;
}

.text-input {
    width: 100%;

    padding: 12px;

    background: #0c1017;

    border: 1px solid #29313e;

    border-radius: 8px;

    outline: none;

    color: white;

    font-size: 15px;
}

.text-input:focus {
    border-color: #1456A0;
}

/* =========================
   COVER PICKER
========================= */

.cover-picker {
    margin-top: 17px;
}

.cover-preview {
    width: 100%;
    height: 180px;

    margin-bottom: 10px;

    border-radius: 10px;

    background: #171d27;

    border: 1px solid #29313e;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    font-size: 48px;
}

.cover-preview img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.cover-button {
    width: 100%;

    padding: 11px;

    border-radius: 8px;

    background: #202631;

    color: #dce2eb;

    font-weight: 600;
}

/* =========================
   MODAL BUTTONS
========================= */

.modal-buttons {
    display: flex;

    gap: 9px;

    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;

    padding: 12px;

    border-radius: 8px;

    font-weight: 600;
}

.save-button {
    background: #1456A0;
    color: white;
}

.cancel-button {
    background: #202631;
    color: #d4d9e1;
}

/* =========================
   GAME SHEET
========================= */

.sheet-backdrop {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, .65);

    display: none;

    z-index: 30;
}

.sheet-backdrop.show {
    display: block;
}

.sheet {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    background: #121720;

    border-top: 1px solid #29313e;

    border-radius: 18px 18px 0 0;

    padding: 20px;

    padding-bottom:
        calc(20px + env(safe-area-inset-bottom));
}

.sheet-name {
    font-size: 20px;
    font-weight: 700;

    margin-bottom: 5px;
}

.sheet-path {
    color: #778191;

    font-size: 12px;

    margin-bottom: 18px;

    word-break: break-all;
}

.sheet button {
    width: 100%;

    padding: 13px;

    margin-top: 9px;

    border-radius: 9px;

    font-weight: 600;
}

.play-button {
    background: #1456A0;
    color: white;
}

.remove-button {
    background: #202631;
    color: #ff7272;
}

.sheet-cancel {
    background: #202631;
    color: #d4d9e1;
}

/* =========================
   SCANNING
========================= */

.scanning {
    position: fixed;

    inset: 0;

    background: rgba(5, 7, 10, .82);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 50;
}

.scanning.show {
    display: flex;
}

.scanning-box {
    width: 280px;

    padding: 24px;

    border-radius: 14px;

    background: #151a23;

    border: 1px solid #28303d;

    text-align: center;
}

.spinner {
    width: 34px;
    height: 34px;

    margin: 0 auto 15px;

    border: 3px solid #303846;

    border-top-color: #1456A0;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.scan-text {
    font-weight: 600;
}

.scan-sub {
    margin-top: 7px;

    color: #788292;

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .container {
        padding: 16px;
    }

    .grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }

    .cover {
        height: 125px;
    }

    .topbar {
        padding: 0 14px;
    }

    .add-button {
        padding: 9px 12px;
    }
}
    
#toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: #151a24;
    color: #fff;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    border: 1px solid #252d3b;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 9999;
}

#toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

</style>
</head>

<body>

<header class="topbar">

    <div class="logo">

        <div class="logo-icon">
            🎮
        </div>

        <span>
            RPG Loader
        </span>

    </div>

    <button
        class="add-button"
        onclick="openFilePicker()"
    >
        + Add Game
    </button>

</header>


<!-- DATA.WIN PICKER -->

<input
    id="fileInput"
    class="hidden-input"
    type="file"
>


<!-- COVER PICKER -->

<input
    id="imageInput"
    class="hidden-input"
    type="file"
    accept="image/*"
>


<main class="container">

    <div class="library-header">

        <div class="library-title">
            Library
        </div>

        <div
            class="game-count"
            id="gameCount"
        >
            0 games
        </div>

    </div>


    <!-- EMPTY -->

    <section
        id="emptyState"
        class="empty"
    >

        <div class="empty-inner">

            <div class="empty-icon">
                🎮
            </div>

            <h2>
                No games yet
            </h2>

            <p>
                Add a GameMaker
                <b>data.win</b>
                file to your library.
            </p>

            <button
                class="empty-add"
                onclick="openFilePicker()"
            >
                Add Game
            </button>

        </div>

    </section>


    <!-- GAMES -->

    <section
        id="gameGrid"
        class="grid"
    ></section>

</main>


<!-- ADD GAME MODAL -->

<div
    id="addModal"
    class="modal-backdrop"
>

    <div class="modal">

        <div class="modal-title">
            Add Game
        </div>


        <label class="input-label">
            Game name
        </label>

        <input
            id="gameNameInput"
            class="text-input"
            type="text"
            placeholder="Enter game name"
            autocomplete="off"
        >


        <div class="cover-picker">

            <label class="input-label">
                Game image
            </label>

            <div
                id="coverPreview"
                class="cover-preview"
            >
                🎮
            </div>

            <button
                class="cover-button"
                onclick="openImagePicker()"
            >
                Choose Image
            </button>

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="closeAddModal()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="saveGame()"
            >
                Add Game
            </button>

        </div>

    </div>

</div>


<!-- GAME SHEET -->

<div
    id="sheetBackdrop"
    class="sheet-backdrop"
    onclick="closeSheet()"
>

    <div
        class="sheet"
        onclick="event.stopPropagation()"
    >

        <div
            class="sheet-name"
            id="sheetName"
        ></div>

        <div
            class="sheet-path"
            id="sheetPath"
        ></div>


        <button
            class="play-button"
            onclick="launchGame()"
        >
            ▶ Play
        </button>


        <button
            class="remove-button"
            onclick="removeGame()"
        >
            Remove
        </button>


        <button
            class="sheet-cancel"
            onclick="closeSheet()"
        >
            Cancel
        </button>

    </div>

</div>


<!-- SCANNING -->

<div
    id="scanning"
    class="scanning"
>

    <div class="scanning-box">

        <div class="spinner"></div>

        <div class="scan-text">
            Loading game...
        </div>

        <div
            class="scan-sub"
            id="scanSub"
        >
            Reading data.win
        </div>

    </div>

</div>


<script>

/* =========================
   DATA
========================= */

const STORAGE_KEY =
    "rpg_loader_library";

let games = [];

let selectedGame = null;

function saveSelectedGame(game) {
    if (!game) {
        localStorage.removeItem("selectedGame");
        return;
    }
    localStorage.setItem("selectedGame", JSON.stringify(game));
}

function loadSelectedGame() {
    const raw = localStorage.getItem("selectedGame");
    if (!raw) return null;
    try {
        return JSON.parse(raw);
    } catch (e) {
        return null;
    }
}

window.restoreSelectedGame = function(uri, title, folderUri) {
    if (!uri || !folderUri) return;
    selectedGame = {
        uri,
        name: title || "Game",
        title: title || "Game",
        folderUri
    };
    renderGameSheet(selectedGame);
    saveSelectedGame(selectedGame);
};

let pendingFile = null;

let pendingImage = null;


/* =========================
   LOAD LIBRARY
========================= */

function loadLibrary() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {

            games = [];

            return;

        }


        const parsed =
            JSON.parse(saved);


        if (!Array.isArray(parsed)) {

            games = [];

            return;

        }


        games = parsed.map(game => ({
            ...game,
            dataWin: null
        }));

    } catch (error) {

        console.error(
            "Failed to load library:",
            error
        );

        games = [];

    }

}


/* =========================
   SAVE LIBRARY
========================= */

function saveLibrary() {

    try {

        /*
         * File objects cannot be stored
         * in localStorage.
         *
         * Only library metadata is saved.
         */

        const libraryData =
            games.map(game => ({

                id: game.id,

                name: game.name,

                type: game.type,

                path: game.path,

                uri: game.uri || null,

                image: game.image || null

            }));


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(libraryData)
        );

    } catch (error) {

        console.error(
            "Failed to save library:",
            error
        );


        if (
            error &&
            error.name === "QuotaExceededError"
        ) {

            alert(
                "The library storage is full. Try using smaller game images."
            );

        }

    }

}


/* =========================
   OPEN FILE PICKER
========================= */

function openFilePicker() {
    if (window.Android && typeof Android.openFolderPicker === 'function') {
        Android.openFolderPicker();
    } else {
        const input = document.getElementById('fileInput');
        if (input) input.click();
    }
}



/* =========================
   DATA.WIN SELECT
========================= */

document
    .getElementById("fileInput")
    .addEventListener(
        "change",
        async function(event) {

            const file =
                event.target.files[0];

            if (!file) {

                return;

            }


            if (
                file.name.toLowerCase()
                !== "data.win"
            ) {

                alert(
                    "Please select a file named data.win."
                );

                event.target.value = "";

                return;

            }


            pendingFile = file;


            showScanning();


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        250
                    )
            );


            hideScanning();


            document
                .getElementById(
                    "gameNameInput"
                )
                .value =
                    "GameMaker Game";


            pendingImage = null;


            document
                .getElementById(
                    "coverPreview"
                )
                .innerHTML =
                    "🎮";


            document
                .getElementById(
                    "addModal"
                )
                .classList
                .add("show");


            event.target.value = "";

        }
    );


/* =========================
   IMAGE PICKER
========================= */

function openImagePicker() {

    document
        .getElementById("imageInput")
        .click();

}


document
    .getElementById("imageInput")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];

            if (!file) {

                return;

            }


            if (
                !file.type.startsWith("image/")
            ) {

                alert(
                    "Please select an image."
                );

                event.target.value = "";

                return;

            }


            pendingImage = file;


            const reader =
                new FileReader();


            reader.onload = function(e) {

                document
                    .getElementById(
                        "coverPreview"
                    )
                    .innerHTML = `

                        <img
                            src="${e.target.result}"
                            alt="Game cover"
                        >

                    `;

            };


            reader.readAsDataURL(file);


            event.target.value = "";

        }
    );


/* =========================
   SAVE GAME
========================= */

function saveGame() {

    if (!pendingFile) {

        return;

    }


    let name =
        document
            .getElementById(
                "gameNameInput"
            )
            .value
            .trim();


    if (!name) {

        name =
            "GameMaker Game";

    }


    const id =
        Date.now() +
        "_" +
        pendingFile.size +
        "_" +
        pendingFile.lastModified;


    const game = {

        id: id,

        name: name,

        type: "GameMaker",

        path: pendingFile.name,

        /*
         * The real File object is kept only
         * while this page is running.
         *
         * It will be replaced later with
         * Android SAF file/folder access.
         */

        dataWin: pendingFile,

        image: null

    };


    if (pendingImage) {

        const reader =
            new FileReader();


        reader.onload = function(e) {

            game.image =
                e.target.result;


            games.push(game);


            saveLibrary();


            finishAddingGame();

        };


        reader.readAsDataURL(
            pendingImage
        );

    } else {

        games.push(game);


        saveLibrary();


        finishAddingGame();

    }

}


/* =========================
   FINISH ADD
========================= */

function finishAddingGame() {

    pendingFile = null;

    pendingImage = null;


    document
        .getElementById(
            "gameNameInput"
        )
        .value = "";


    document
        .getElementById(
            "coverPreview"
        )
        .innerHTML =
            "🎮";


    closeAddModal();


    renderGames();

}


/* =========================
   CLOSE ADD MODAL
========================= */

function closeAddModal() {

    document
        .getElementById(
            "addModal"
        )
        .classList
        .remove("show");


    pendingFile = null;

    pendingImage = null;

}


/* =========================
   RENDER
========================= */

function renderGames() {

    const grid =
        document.getElementById(
            "gameGrid"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    const count =
        document.getElementById(
            "gameCount"
        );


    grid.innerHTML = "";


    count.textContent =
        games.length +
        (
            games.length === 1
                ? " game"
                : " games"
        );


    if (!games.length) {

        empty.style.display =
            "flex";

        return;

    }


    empty.style.display =
        "none";


    for (const game of games) {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        card.onclick =
            function() {

                openGameSheet(game);

            };


        let coverHTML;


        if (game.image) {

            coverHTML = `

                <img
                    src="${game.image}"
                    alt="${escapeHTML(game.name)}"
                >

            `;

        } else {

            coverHTML = `

                <div class="default-cover">
                    🎮
                </div>

            `;

        }


        card.innerHTML = `

            <div class="cover">

                ${coverHTML}

            </div>


            <div class="card-info">

                <div class="card-name">

                    ${escapeHTML(game.name)}

                </div>


                <div class="card-type">

                    ${escapeHTML(game.type)}

                </div>


                <div class="card-path">

                    ${escapeHTML(game.path)}

                </div>

            </div>

        `;


        grid.appendChild(card);

    }

}


/* =========================
   GAME SHEET
========================= */

function openGameSheet(game) {

    selectedGame = game;
    saveSelectedGame(game);


    document
        .getElementById(
            "sheetName"
        )
        .textContent =
            game.name;


    document
        .getElementById(
            "sheetPath"
        )
        .textContent =
            game.path;


    document
        .getElementById(
            "sheetBackdrop"
        )
        .classList
        .add("show");

}


function closeSheet() {

    selectedGame = null;
    saveSelectedGame(null);


    document
        .getElementById(
            "sheetBackdrop"
        )
        .classList
        .remove("show");

}


/* =========================
   PLAY
========================= */

function launchGame() {
    if (!selectedGame) {
        showToast("Chưa chọn game");
        return;
    }

    if (!window.Android ||
        typeof window.Android.launchGameFromUri !== "function") {
        showToast("Android runtime unavailable");
        return;
    }

    const uri = selectedGame.uri;
    const title = selectedGame.name || "Game";
    const folderUri = selectedGame.folderUri;

    if (!uri) {
        showToast("Không tìm thấy URI của data.win");
        return;
    }

    if (!folderUri) {
        showToast("Thiếu thư mục game. Hãy Add Game lại.");
        return;
    }

    showToast("Launching " + title + "...");
    closeSheet();
    window.Android.launchGameFromUri(uri, title, folderUri);
}

/* =========================
   REMOVE
========================= */

function removeGame() {

    if (!selectedGame) {

        return;

    }


    games =
        games.filter(
            game =>
                game.id !==
                selectedGame.id
        );


    saveLibrary();


    closeSheet();


    renderGames();

}


/* =========================
   SCANNING
========================= */

function showScanning() {

    document
        .getElementById(
            "scanning"
        )
        .classList
        .add("show");

}


function hideScanning() {

    document
        .getElementById(
            "scanning"
        )
        .classList
        .remove("show");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(message) {

    const toast =
        document.getElementById("toast");

    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(function() {
        toast.classList.remove("show");
    }, 2500);
}

/* =========================
   ANDROID FOLDER SCAN
========================= */

window.onAndroidFolderSelected = function(uri) {

    showScanning();

    setTimeout(function() {

        try {

            if (
                typeof Android === "undefined" ||
                !Android.scanFolder
            ) {

                hideScanning();

                showToast(
                    "Android bridge unavailable"
                );

                return;
            }

            const result =
                Android.scanFolder(uri);

            if (!result) {

                hideScanning();

                showToast(
                    "No GameMaker games found"
                );

                return;
            }

            const scannedGames =
                JSON.parse(result);

            let added = 0;

            for (
                const scanned of scannedGames
            ) {

                if (
                    !scanned ||
                    !scanned.folderUri
                ) {
                    continue;
                }

                const alreadyExists =
                    games.some(
                        game =>
                            game.folderUri ===
                                scanned.folderUri ||
                            game.uri ===
                                scanned.folderUri
                    );

                if (alreadyExists) {
                    continue;
                }

                let image = null;

                if (
                    scanned.image &&
                    scanned.image !== "null"
                ) {
                    image =
                        "data:image/png;base64," +
                        scanned.image;
                }

                games.push({

                    id:
                        Date.now() +
                        "_" +
                        added,

                    name:
                        scanned.name ||
                        "GameMaker Game",

                    type:
                        scanned.type ||
                        "GameMaker",

                    path:
                        "data.win",

                    /*
                     * URI của toàn bộ game folder.
                     * Dùng lại khi Play để copy toàn bộ game.
                     */
                    uri:
                        scanned.folderUri,

                    folderUri:
                        scanned.folderUri,

                    /*
                     * Chỉ là metadata cache.
                     * Sau khi app restart loadLibrary()
                     * có thể bỏ giá trị này.
                     */
                    dataWin:
                        null ||
                        null,

                    image:
                        image
                });

                added++;
            }

            saveLibrary();

            renderGames();

            hideScanning();

            if (added > 0) {

                showToast(
                    added === 1
                        ? "1 game added to library"
                        : added +
                          " games added to library"
                );

            } else {

                showToast(
                    "All games are already in your library"
                );
            }

        } catch (error) {

            hideScanning();

            console.error(error);

            showToast(
                "Failed to scan folder"
            );
        }

    }, 100);

};


/* =========================
   INITIALIZE
========================= */

loadLibrary();

renderGames();

function onFolderScanned(results) {
    try {
        if (typeof results === 'string') {
            results = JSON.parse(results);
        }
        if (!Array.isArray(results)) {
            results = [];
        }

        const scanned = results.map(game => ({
            id: game.uri,
            name: game.title || 'Game',
            type: 'data.win',
            uri: game.uri,
            folderUri: game.folderUri,
            path: game.uri,
            size: game.size || 0,
            dataWin: null
        }));

        games = scanned;
        saveLibrary();
        renderGames();

        const scanning = document.getElementById('scanning');
        if (scanning) scanning.classList.remove('show');

        if (scanned.length === 0) {
            showToast('Không tìm thấy data.win trong thư mục đã chọn');
        } else {
            showToast('Đã tìm thấy ' + scanned.length + ' game');
        }
    } catch (error) {
        console.error('Folder scan failed:', error);
        showToast('Không thể đọc thư mục game');
    }
}
</script>

<div id="toast"></div>
</body>
